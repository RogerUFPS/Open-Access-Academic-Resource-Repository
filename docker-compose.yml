x-service: &service
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
  networks:
    - services

services:
  backend-init:
    <<: *service
    build: ./Backend
    image: harvest-backend-init
    pull_policy: never
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ./Backend/.env
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DATABASE_POOL: "0"
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py bootstrap_superadmin"]

  rabbitmq:
    <<: *service
    build: ./RabbitMQ
    user: rabbitmq
    env_file: ./RabbitMQ/.env
    healthcheck: 
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    cap_add:
      - SETGID
      - SETUID
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  backend:
    <<: *service
    build: ./Backend
    image: harvest-backend
    pull_policy: never
    depends_on:
      backend-init:
        condition: service_completed_successfully
      rustfs-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    env_file: ./Backend/.env
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DATABASE_POOL: ${DATABASE_POOL:-1}
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *service
    image: harvest-backend
    pull_policy: never
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file: ./Backend/.env
    command: ["celery", "-A", "project", "worker",
              "--loglevel=INFO", "--queues=harvesting", "--concurrency=2"]

  beat:
    <<: *service
    image: harvest-backend
    pull_policy: never
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file: ./Backend/.env
    command: ["celery", "-A", "project", "beat", "--loglevel=INFO",
              "--schedule=/tmp/celerybeat-schedule"]

  frontend:
    <<: *service
    build:
      context: ./Frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
    env_file: ./Frontend/.env
    environment:
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
    ports:
      - "127.0.0.1:3000:3000"

  postgres:
    <<: *service
    image: ${LOCAL_POSTGRES_IMAGE:-postgres:18-alpine}
    env_file: ./Postgres/.env
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:${LOCAL_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  rustfs:
    <<: *service
    image: rustfs/rustfs:latest
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/var/log/rustfs/
    env_file:
      - ./RustFS/.env
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: "error"
      RUSTFS_OBS_LOG_DIRECTORY: "/var/log/rustfs/"
    command: /data

  rustfs-init:
    <<: *service
    image: rustfs/rc:latest
    restart: "no"
    depends_on:
      rustfs:
        condition: service_healthy
    env_file:
      - ./RustFS/.env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        rc alias set local http://rustfs:9000 "$$RUSTFS_ACCESS_KEY" "$$RUSTFS_SECRET_KEY" --region us-east-1 --bucket-lookup path
        rc bucket create local/imagenes --ignore-existing
        rc anonymous set download local/imagenes

networks:
  services:
    driver: bridge

volumes:
  rabbitmq_data:
  postgres-data:
  rustfs-data:
  rustfs-logs:
