x-backend-env: &backend-env
  - path: ./Backend/.env
  - path: ./Backend/.agent.env
    required: false

x-service: &service
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
  networks:
    - services

services:
  # Solo con --profile local-agent: GPU y pesos locales. Nunca en up normal.
  agent-api:
    profiles: [local-agent]
    extends:
      file: ./Agent/docker-compose.yml
      service: api
    networks:
      services:
        aliases: ["biblioteca-agent-${AGENT_INSTANCE:-qwen}"]
      agent-inference:

  vllm:
    profiles: [local-agent]
    extends:
      file: ./Agent/docker-compose.yml
      service: vllm
    networks: [agent-inference]

  backend-tests:
    profiles: [test]
    image: harvest-backend
    pull_policy: never
    env_file: *backend-env
    volumes:
      - ./Backend:/app:ro
    command: ["python", "manage.py", "test", "apps.agent", "apps.account.tests", "apps.scheduler.tests", "--noinput", "-v", "2"]
    networks: [services]

  backend-init:
    <<: *service
    build: ./Backend
    image: harvest-backend-init
    pull_policy: never
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    env_file: *backend-env
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py bootstrap_superadmin"]

  rabbitmq:
    <<: *service
    build: ./RabbitMQ
    user: rabbitmq
    env_file: ./RabbitMQ/.env
    healthcheck: 
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    cap_add:
      - SETGID
      - SETUID
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  backend:
    <<: *service
    build: ./Backend
    image: harvest-backend
    pull_policy: never
    depends_on:
      backend-init:
        condition: service_completed_successfully
      rustfs-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    env_file: *backend-env
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *service
    image: harvest-backend
    pull_policy: never
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file: *backend-env
    command: ["celery", "-A", "project", "worker",
              "--loglevel=INFO", "--queues=harvesting", "--concurrency=2"]

  beat:
    <<: *service
    image: harvest-backend
    pull_policy: never
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file: *backend-env
    command: ["celery", "-A", "project", "beat", "--loglevel=INFO",
              "--schedule=/tmp/celerybeat-schedule"]

  agent-worker:
    # Consultas al agente por HTTP, tanto en Modal como en despliegue local.
    <<: *service
    image: harvest-backend
    pull_policy: never
    depends_on:
      backend-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    env_file: *backend-env
    command: ["celery", "-A", "project", "worker", "--loglevel=WARNING",
              "--queues=agent", "--concurrency=4", "--hostname=agent@%h"]

  agent-control:
    # Cambio seguro entre endpoints del agente, locales o de Modal.
    <<: *service
    image: harvest-backend
    pull_policy: never
    depends_on:
      backend-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    env_file: *backend-env
    command: ["celery", "-A", "project", "worker", "--loglevel=WARNING",
              "--queues=agent-control", "--concurrency=1", "--hostname=agent-control@%h"]

  audit-compressor:
    # Solo red interna: el Backend lo consultará como http://audit-compressor:8000.
    <<: *service
    build: ./AuditCompressor
    image: audit-compressor
    pull_policy: never
    env_file:
      - path: ./AuditCompressor/.env
        required: false

  frontend:
    <<: *service
    build:
      context: ./Frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
        NEXT_PUBLIC_SESSION_COOKIE_NAME: ${NEXT_PUBLIC_SESSION_COOKIE_NAME:-sessionid}
        NEXT_PUBLIC_CSRF_COOKIE_NAME: ${NEXT_PUBLIC_CSRF_COOKIE_NAME:-csrftoken}
    env_file: ./Frontend/.env
    ports:
      - "127.0.0.1:3000:3000"

  postgres:
    <<: *service
    image: ${LOCAL_POSTGRES_IMAGE:-postgres:18-alpine}
    env_file: ./Postgres/.env
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:${LOCAL_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  rustfs:
    <<: *service
    image: rustfs/rustfs:latest
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/var/log/rustfs/
    env_file:
      - ./RustFS/.env
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command: /data

  rustfs-init:
    <<: *service
    image: rustfs/rc:latest
    restart: "no"
    depends_on:
      rustfs:
        condition: service_healthy
    env_file:
      - ./RustFS/.env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        rc alias set local http://rustfs:9000 "$$RUSTFS_ACCESS_KEY" "$$RUSTFS_SECRET_KEY" --region us-east-1 --bucket-lookup path
        rc bucket create local/imagenes --ignore-existing
        rc anonymous set download local/imagenes

networks:
  agent-inference:
    driver: bridge
  services:
    driver: bridge

volumes:
  huggingface-cache:
  rabbitmq_data:
  postgres-data:
  rustfs-data:
  rustfs-logs:
