services:
  frontend:
    build:
      context: ./Frontend
      target: deps
    user: "root"  # Usamos root para solucionar los problemas de montaje en Linux
    volumes:
      - ./Frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next  # Movemos la caché de desarrollo a un volumen aislado
    command: pnpm dev

volumes:
  frontend_node_modules:
  frontend_next_cache:

