# Configuración no sensible del archivado de auditoría.
# Los secretos (PostgreSQL, RustFS, API Key, cifrado) se leen de AuditCompressor/.env.
# El período a archivar no se define aquí: lo indica cada orden de archivado.
#
# Cada fuente es una tabla independiente: tiene sus propios snapshots en
# <S3_BUCKET>/<nombre de la fuente>/<snapshot_id>/ y su propia ruta en la API.

# Zona horaria de los semestres: las fechas de cada orden se interpretan a
# medianoche en esta zona. Debe coincidir con AUDIT_ARCHIVE_TIMEZONE del Backend.
timezone: America/Bogota

sources:
  # Auditoría general de django-auditlog; apps.audit.AuditLog es un proxy sobre ella.
  auditlog:
    schema: public
    table: auditlog_logentry
    timestamp_column: timestamp
    primary_key: id
    # Columnas jsonb: la consulta histórica las devuelve como objetos JSON.
    json_columns: [changes, serialized_data, additional_data]

  # Eventos de seguridad del superadmin (apps.account.SuperadminAuditEvent).
  superadmin_events:
    schema: public
    table: account_superadminauditevent
    timestamp_column: timestamp
    primary_key: id
    json_columns: [details]
    # Se comprime cada semestre, pero no se borra de PostgreSQL: el trigger
    # account_superadmin_audit_no_update_delete (apps/account, migración 0004)
    # rechaza DELETE. Cambiar a true cuando el equipo retire DELETE del trigger.
    offload: false

parquet:
  compression: zstd
