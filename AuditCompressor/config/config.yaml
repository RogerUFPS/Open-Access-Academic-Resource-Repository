# Configuración interna de AuditCompressor.
#
# IMPORTANTE:
# - Este archivo NO tiene el formato de Backparq. Cuando se confirme el paquete,
#   la versión y su configuración real, se adaptará o se generará a partir de él.
# - Todavía ningún código lo lee.
# - Los secretos NO van aquí: se leen de AuditCompressor/.env.

database:
  # Conexión definida por DATABASE_* en .env.
  engine: postgresql

audit:
  # Tabla de django-auditlog. apps.audit.AuditLog es un modelo proxy sobre ella.
  table: auditlog_logentry
  primary_key: id
  # DateTimeField con índice; base para archivar por rango de fechas.
  timestamp_column: timestamp

archive:
  mode: offload
  # PENDIENTE: definir qué es "un semestre pasado" (fechas exactas del rango,
  # frecuencia y tratamiento de ejecuciones parciales).
  window: null
  # No eliminar registros de PostgreSQL hasta que se decida funcionalmente.
  delete_source: false

storage:
  # Conexión definida por S3_* en .env (RustFS existente).
  provider: s3
  prefix: audit/auditlog_logentry/

compression:
  format: parquet
  # PENDIENTE: confirmar códec soportado por Backparq.
  codec: null

integrity:
  algorithm: sha256

encryption:
  # Clave definida por AUDIT_ENCRYPTION_KEY en .env.
  # PENDIENTE: algoritmo y forma de gestionar la clave.
  required: true
  algorithm: null
